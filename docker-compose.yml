services:
  ozonfresh-bot:
    build: .
    container_name: ozonfresh-bot
    restart: unless-stopped
    environment:
      - TZ=Europe/Moscow
      - DB_PATH=/data/schedule.db
      - BOT_TOKEN=8953661250:AAF8ZpxMFP4-j25QsvWGQGcTiYAUmeNj0Wk
      - ADMIN_IDS=1058638017
      - DARKSTORE=Ozon Fresh Даркстор Подольск Октябрьский
    volumes:
      - ozonbot_data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  ozonbot_data:
